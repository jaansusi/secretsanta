# Local development infrastructure only. Ports are bound to 127.0.0.1 so the
# database and pgAdmin are not reachable from the rest of the network.
services:
  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - santa-network

  # Optional: `docker compose --profile tools up -d` to start it.
  pgadmin:
    image: dpage/pgadmin4:9@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    container_name: pgadmin4_container
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - santa-network

networks:
  santa-network:
    name: santanet

volumes:
  pgdata:
  pgadmin-data:
