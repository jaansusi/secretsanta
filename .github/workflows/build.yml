# Build the container image and push it to GitHub Container Registry.
#
# Runs on GitHub-hosted runners (free for a public repo) and pushes to
# ghcr.io/jaansusi/secretsanta. No registry secret is needed: the workflow's
# own GITHUB_TOKEN can push packages owned by this repo. After the FIRST push
# set the package to public (GitHub -> Packages -> secretsanta -> Package
# settings -> Change visibility), otherwise the cluster needs a pull secret.
#
# Tag = <YYYYMMDD>-<short sha> in Tallinn time. Unique per commit, sortable,
# never reused. The deployment manifest in home-infra pins this tag; `latest`
# is deliberately not published so nothing can run an unpinned image.
name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          TZ: Europe/Tallinn
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          # Single-platform image; attestation manifest lists only confuse
          # pulls (same rule as every other image on the home cluster).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: echo "Pushed ${IMAGE}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
